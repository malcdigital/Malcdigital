name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Editable install so packaging and the console script are exercised
          # too, not just the source tree.
          pip install -e .
          pip install pytest

      - name: Test
        run: python -m pytest tests/ -q

      - name: Smoke-test the CLI
        run: |
          quantdesk --version
          quantdesk profiles

  oldest-deps:
    # requirements.txt claims pandas>=2.0 and numpy>=1.24. This job is what
    # makes that claim true rather than aspirational: without it, a pandas API
    # introduced in 2.2 could land unnoticed and break every user on the floor.
    name: oldest supported dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install the floor
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pandas==2.0.0" "numpy==1.24.4" "requests==2.31.0" pytest

      - name: Report resolved versions
        run: python -c "import pandas, numpy; print('pandas', pandas.__version__, '/ numpy', numpy.__version__)"

      - name: Test
        run: python -m pytest tests/ -q
