name: coaster

on:
  push:
    branches: [main]
    paths: ['coaster/**', '.github/workflows/coaster.yml']
  pull_request:
    paths: ['coaster/**', '.github/workflows/coaster.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: godot headless tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version

      # Builds the class_name cache (.godot/) the scripts need.
      - name: Import project
        run: timeout 300 godot --headless --path coaster --import

      # A script that fails to compile makes Godot wait forever, hence the timeouts.
      - name: Unit tests (physics, spline, scoring, data, riders)
        run: timeout 300 godot --headless --path coaster -s res://tests/run_tests.gd

      - name: Smoke test (editor input, ride, results, save/load)
        run: timeout 600 godot --headless --path coaster -s res://tests/smoke_ui.gd
